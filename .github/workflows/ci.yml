name: Validate extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript, metadata and test syntax
        run: |
          node --check static/grid.js
          python3 -m json.tool metadata.json > /dev/null
          python3 -m py_compile tests/browser.py
      - name: Validate with FreshRSS 1.30.1
        run: |
          docker run --rm --entrypoint php -v "$PWD:/release:ro" freshrss/freshrss:1.30.1 -l /release/extension.php
          docker run --rm --entrypoint php -e FRESHRSS_ROOT=/var/www/FreshRSS -v "$PWD:/release:ro" freshrss/freshrss:1.30.1 /release/tests/extension.php
